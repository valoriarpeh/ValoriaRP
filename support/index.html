<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValoriaRP - Support</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0b0a0a; color: #f5f0e6; padding: 1rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

        .container {
            max-width: 600px; width: 100%;
            background: #14110e; border: 1px solid #3f3423;
            border-radius: 20px; padding: 2rem;
        }
        h1 { color: #e8d6a8; margin-bottom: 0.5rem; font-size: 1.5rem; text-align: center; }
        .subtitle { text-align: center; color: #b8a582; font-size: 0.9rem; margin-bottom: 1.5rem; font-style: italic; }

        label { display: block; color: #e8d6a8; font-size: 0.9rem; margin-bottom: 0.4rem; margin-top: 1rem; }
        input, textarea {
            width: 100%; padding: 0.8rem; border-radius: 10px;
            border: 1px solid #3f3423; background: #1f1b16;
            color: #6b6258; font-size: 1rem; font-family: inherit;
            cursor: not-allowed; resize: vertical;
        }
        textarea { min-height: 120px; }

        #btn {
            width: 100%; margin-top: 1.5rem;
            padding: 0.9rem; border: none; border-radius: 10px;
            background: #3a3a3a; color: #8a8a8a;
            font-weight: bold; font-size: 1rem;
            cursor: not-allowed; opacity: 0.7;
        }

        .notif {
            position: fixed; top: 1rem; left: 1rem;
            background: #2a0f0f; border: 1px solid #a83232;
            border-left: 4px solid #ff4d4d;
            color: #ffd6d6; padding: 0.8rem 2.5rem 0.8rem 1rem;
            border-radius: 10px; font-size: 0.9rem;
            z-index: 1000; display: flex; align-items: center; gap: 0.7rem;
            box-shadow: 0 4px 15px rgba(168, 50, 50, 0.3);
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .notif .icone {
            width: 22px; height: 22px; min-width: 22px;
            background: #ff4d4d; color: #fff;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
        }
        .notif .contenu { display: flex; flex-direction: column; }
        .notif .titre { font-weight: bold; color: #ff8a8a; font-size: 0.85rem; }
        .notif .desc { color: #ffd6d6; font-size: 0.8rem; }
        .notif .fermer {
            position: absolute; top: 0.5rem; right: 0.6rem;
            background: transparent; border: none;
            color: #ff8a8a; font-size: 1.1rem; cursor: pointer;
            line-height: 1; padding: 0;
        }
        .notif .fermer:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="notif" id="notif">
        <div class="icone">!</div>
        <div class="contenu">
            <div class="titre">Serveur fermé</div>
            <div class="desc">Les tickets ne sont plus disponibles.</div>
        </div>
        <button class="fermer" onclick="document.getElementById('notif').style.display='none'">✕</button>
    </div>

    <div class="container">
        <h1>🎫 Support ValoriaRP</h1>
        <p class="subtitle">Ouvre un ticket pour contacter le staff.</p>

        <label for="pseudo">👤 Votre pseudo</label>
        <input type="text" id="pseudo" placeholder="Non disponible..." disabled>

        <label for="probleme">📝 Votre problème</label>
        <textarea id="probleme" placeholder="Non disponible..." disabled></textarea>

        <button id="btn" disabled>Non Disponible</button>
    </div>

    <script type="module">
        // ⛔ Serveur fermé — création de tickets désactivée
        console.log('🔒 Serveur fermé — création de tickets désactivée.');

        window.creerTicket = function() {
            alert('❌ Le serveur est fermé. Les tickets ne sont plus disponibles.');
        };
    </script>

</body>
</html>
