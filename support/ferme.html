<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ticket fermé - ValoriaRP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0b0a0a; color: #f5f0e6;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 1rem;
        }
        .box {
            background: #14110e; border: 1px solid #3f3423;
            border-radius: 20px; padding: 3rem;
            text-align: center; max-width: 500px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 5rem; margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 { color: #e8d6a8; margin-bottom: 1rem; font-size: 1.8rem; }
        p { color: #b8a582; margin-bottom: 2rem; line-height: 1.5; }
        a {
            display: inline-block; padding: 0.9rem 2rem;
            background: #c9a84c; color: #0b0a0a;
            text-decoration: none; border-radius: 10px;
            font-weight: 700; transition: all 0.3s;
        }
        a:hover { background: #dbb55a; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✅</div>
        <h1>Ticket fermé</h1>
        <p>Votre ticket a été fermé par le staff.<br>Merci de nous avoir contactés !</p>
        <a href="index.html">Retour à l'accueil</a>
    </div>
</body>
</html>
