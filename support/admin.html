<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ValoriaRP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0b0a0a; color: #f5f0e6;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }

        .notif {
            position: fixed; top: 1rem; left: 1rem;
            background: #2a0f0f; border: 1px solid #a83232;
            border-left: 4px solid #ff4d4d;
            color: #ffd6d6;
            padding: 0.8rem 3.2rem 0.8rem 1rem;
            border-radius: 10px; font-size: 0.9rem;
            z-index: 1000; display: flex; align-items: center; gap: 0.7rem;
            box-shadow: 0 4px 15px rgba(168, 50, 50, 0.3);
            animation: slideIn 0.4s ease;
            max-width: calc(100vw - 2rem);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .notif .icone {
            width: 22px; height: 22px; min-width: 22px;
            background: #ff4d4d; color: #fff;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .notif .contenu {
            display: flex; flex-direction: column;
            min-width: 0;
            padding-right: 0.5rem;
        }
        .notif .titre { font-weight: bold; color: #ff8a8a; font-size: 0.85rem; }
        .notif .desc {
            color: #ffd6d6; font-size: 0.8rem;
            white-space: normal;
        }
        .notif .fermer {
            position: absolute; top: 50%; right: 0.7rem;
            transform: translateY(-50%);
            background: transparent; border: none;
            color: #ff8a8a; font-size: 1.1rem; cursor: pointer;
            line-height: 1; padding: 0.2rem;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .notif .fermer:hover { color: #fff; background: rgba(255,77,77,0.2); }

        .box {
            background: #14110e;
            border: 1px solid #3f3423;
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .box .icone-ferme {
            width: 60px; height: 60px;
            background: #2a0f0f; border: 2px solid #ff4d4d;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.8rem; color: #ff4d4d;
            font-weight: bold;
        }
        h1 { color: #ff8a8a; margin-bottom: 0.8rem; font-size: 1.5rem; }
        .msg {
            color: #b8a582; font-size: 0.95rem;
            line-height: 1.5; margin-bottom: 1.5rem;
        }
        .back-link {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            border: 1px solid #3f3423;
            color: #b8a582;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .back-link:hover { border-color: #c9a84c; color: #e8c45a; }
    </style>
</head>
<body>

    <div class="notif" id="notif">
        <div class="icone">!</div>
        <div class="contenu">
            <div class="titre">Accès fermé</div>
            <div class="desc">Le panneau admin n'est plus accessible.</div>
        </div>
        <button class="fermer" id="fermerNotif">✕</button>
    </div>

    <div class="box">
        <div class="icone-ferme">🔒</div>
        <h1>Accès fermé</h1>
        <p class="msg">
            Le panneau d'administration a été définitivement fermé.<br>
            Le serveur ValoriaRP a cessé son activité.<br>
            Merci d'avoir joué parmi nous. 🖤
        </p>
        <a href="../" class="back-link">← Retour au site</a>
    </div>

    <script>
        // ⛔ Admin désactivé — serveur fermé
        console.log('🔒 Panneau admin fermé.');

        // Notification : se ferme puis revient 2 secondes après
        const notif = document.getElementById('notif');
        const fermerBtn = document.getElementById('fermerNotif');

        if (notif && fermerBtn) {
            fermerBtn.addEventListener('click', () => {
                notif.style.display = 'none';
                setTimeout(() => {
                    notif.style.display = 'flex';
                }, 2000);
            });
        }
    </script>

</body>
